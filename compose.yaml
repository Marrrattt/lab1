name: lab1-postgres
services:
  db:
    build: .
    environment:
      POSTGRES_DB: lab1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=libc --locale=ru_RU.UTF-8 --auth-host=scram-sha-256 --auth-local=trust"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab1"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build: ./app
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app:ro
    stdin_open: true
    tty: true
  web:
    build: ./app
    command: ["python", "web.py"]
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./app:/app:ro
volumes:
  pgdata:
